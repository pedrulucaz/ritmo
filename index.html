<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#162b28">
  <meta name="description" content="Ritmo: musculação e corrida do seu jeito. Monte um plano, registre treinos e acompanhe a evolução.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Ritmo">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Ritmo | Treinos no seu ritmo</title>
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./styles.css?v=6">
  <script src="./profile-media.js?v=5" defer></script>
  <script src="./app.js?v=6" defer></script>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="./" aria-label="Ritmo - Início">
        <span class="brand-mark">R<span class="brand-point">.</span></span>
        <span class="brand-word">ritmo<span class="brand-point">.</span></span>
      </a>
      <div class="top-actions">
        <select id="profile-switch" aria-label="Perfil ativo" hidden></select>
        <button id="profile-open" type="button" class="profile-trigger" hidden aria-label="Abrir seu perfil" title="Abrir perfil">
          <span class="profile-avatar-shell">
            <span class="mini-avatar" id="header-avatar-fallback">R</span>
            <img id="header-avatar" class="mini-avatar" alt="" hidden>
          </span>
        </button>
      </div>
    </header>
    <nav class="tabs" aria-label="Navegação principal" id="tabs" hidden>
      <button data-tab="home" type="button">Início</button>
      <button data-tab="plan" type="button">Meu plano</button>
      <button data-tab="history" type="button">Evolução</button>
      <button data-tab="settings" type="button">Ajustes</button>
    </nav>
    <main id="app" aria-live="polite"></main>
    <footer class="footer">Ritmo — pequenos passos, evolução constante · Dados locais no navegador.</footer>
  </div>
  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
